name: CI

on:
  push:
    branches: [main, initial-setup]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      - name: Type check
        run: |
          mypy src/

      - name: Test
        run: |
          pytest tests/ -v --tb=short

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      # Build-only, no push: every Job/Deployment in this project loads
      # images via `kind load docker-image` (see k8s/), never from a
      # registry. This step is a build-verification gate, not a publish step.
      - name: Build chatbot image
        run: |
          docker build -f Dockerfile.chatbot -t oss-ai-eval-chatbot:${{ github.sha }} .

      - name: Build eval/redteam Jobs image
        run: |
          docker build -f Dockerfile.eval --build-arg GIT_COMMIT=${{ github.sha }} -t oss-ai-eval-jobs:${{ github.sha }} .

      - name: Build promptfoo image
        run: |
          docker build -f Dockerfile.promptfoo --build-arg GIT_COMMIT=${{ github.sha }} -t oss-ai-eval-promptfoo:${{ github.sha }} .

      - name: Build MLflow image
        run: |
          docker build -f Dockerfile.mlflow -t oss-ai-eval-mlflow:${{ github.sha }} .

      - name: Build orchestrator image
        run: |
          docker build -f Dockerfile.orchestrator -t oss-ai-eval-orchestrator:${{ github.sha }} .
