# RAGAS evaluation sweep Job
# ~110 calls per quality cycle (10 questions × 11 calls/question — real
# LLM-judged Context Precision/Faithfulness/Answer Relevancy, dataset size
# reduced from the usual 20 to stay under the 200 hard cap alongside promptfoo)
# NEVER run concurrently with DeepEval sweep (MLflow SQLite write contention)
apiVersion: batch/v1
kind: Job
metadata:
  name: ragas-sweep
  labels:
    app: eval
    cycle: quality
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: eval
        component: ragas
    spec:
      restartPolicy: Never
      containers:
        - name: ragas
          image: oss-ai-eval-jobs:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.eval.ragas_eval"]
          env:
            - name: VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: vertex-credentials
                  key: project-id
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/service-account.json
            - name: CHATBOT_URL
              value: http://chatbot:8000
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: GOLDEN_DATASET_PATH
              value: /data/golden_dataset.json
            - name: EVAL_DATASET_SIZE
              value: "10"
            - name: CLAUDE_HAIKU_MODEL
              value: claude-haiku-4-5
            - name: VERTEX_CLAUDE_LOCATION
              value: us-east5
          volumeMounts:
            - name: vertex-sa
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: vertex-sa
          secret:
            secretName: vertex-credentials
        - name: data
          configMap:
            name: golden-dataset
