# Garak probe run Job
# ~10 calls per safety cycle (10 probes × 1 call each)
apiVersion: batch/v1
kind: Job
metadata:
  name: garak-probe
  labels:
    app: redteam
    cycle: safety
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: redteam
        component: garak
    spec:
      restartPolicy: Never
      containers:
        - name: garak
          image: oss-ai-eval-jobs:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.redteam.garak_probe"]
          env:
            - name: VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: vertex-credentials
                  key: project-id
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/service-account.json
            - name: TARGET_ENDPOINT
              value: http://chatbot:8000/query
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
          volumeMounts:
            - name: vertex-sa
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: vertex-sa
          secret:
            secretName: vertex-credentials
