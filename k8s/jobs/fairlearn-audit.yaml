# Fairlearn audit Job (on-demand)
# ~20 calls per safety cycle (20 items × 1 inference each)
apiVersion: batch/v1
kind: Job
metadata:
  name: fairlearn-audit
  labels:
    app: redteam
    cycle: safety
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: redteam
        component: fairlearn
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: fairlearn
          image: oss-ai-eval-jobs:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.redteam.fairlearn_audit"]
          env:
            - name: VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: vertex-credentials
                  key: project-id
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/service-account.json
            - name: CHATBOT_URL
              value: http://chatbot:8000
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
          volumeMounts:
            - name: vertex-sa
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: vertex-sa
          secret:
            secretName: vertex-credentials
