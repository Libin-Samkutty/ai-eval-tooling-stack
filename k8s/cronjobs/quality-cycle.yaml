# Quality cycle CronJob — alternates RAGAS and DeepEval sweeps
# Runs daily. NEVER run concurrently with safety cycle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quality-cycle
  labels:
    app: eval
    cycle: quality
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid  # Critical: prevents MLflow SQLite contention
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: eval
            cycle: quality
        spec:
          restartPolicy: Never
          containers:
            - name: quality-eval
              image: oss-ai-eval-chatbot:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/run_quality_cycle.py"]
              env:
                - name: VERTEX_PROJECT_ID
                  valueFrom:
                    secretKeyRef:
                      name: vertex-credentials
                      key: project-id
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /secrets/service-account.json
                - name: CHATBOT_URL
                  value: http://chatbot:8000
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow:5000
                - name: GOLDEN_DATASET_PATH
                  value: /data/golden_dataset.json
              volumeMounts:
                - name: vertex-sa
                  mountPath: /secrets
                  readOnly: true
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: vertex-sa
              secret:
                secretName: vertex-credentials
            - name: data
              configMap:
                name: golden-dataset
