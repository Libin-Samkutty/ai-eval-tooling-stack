# Quality cycle CronJob — alternates RAGAS and DeepEval sweeps
# Runs daily. NEVER run concurrently with safety cycle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quality-cycle
  labels:
    app: eval
    cycle: quality
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid  # Critical: prevents MLflow SQLite contention
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: eval
            cycle: quality
        spec:
          serviceAccountName: eval-orchestrator
          restartPolicy: Never
          containers:
            - name: quality-eval
              image: oss-ai-eval-orchestrator:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/run_quality_cycle.py"]
              # No Vertex/Chroma/MLflow env or volumes here — this container
              # only shells out to kubectl (src/orchestration/k8s_jobs.py);
              # the actual eval Jobs it creates (k8s/jobs/*.yaml) declare
              # those themselves.
