# Safety cycle CronJob — PyRIT XPIA, Garak probes, Fairlearn audit
# Runs weekly. NEVER run concurrently with quality cycle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: safety-cycle
  labels:
    app: redteam
    cycle: safety
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  concurrencyPolicy: Forbid  # Critical: prevents MLflow SQLite contention
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: redteam
            cycle: safety
        spec:
          serviceAccountName: eval-orchestrator
          restartPolicy: Never
          containers:
            - name: safety-eval
              image: oss-ai-eval-orchestrator:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/run_safety_cycle.py"]
              # No Vertex/Chroma/MLflow env or volumes here — this container
              # only shells out to kubectl (src/orchestration/k8s_jobs.py);
              # the actual redteam Jobs it creates (k8s/jobs/*.yaml) declare
              # those themselves.
