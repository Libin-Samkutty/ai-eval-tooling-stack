# Safety cycle CronJob — PyRIT XPIA, Garak probes, Fairlearn audit
# Runs weekly. NEVER run concurrently with quality cycle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: safety-cycle
  labels:
    app: redteam
    cycle: safety
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  concurrencyPolicy: Forbid  # Critical: prevents MLflow SQLite contention
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: redteam
            cycle: safety
        spec:
          restartPolicy: Never
          containers:
            - name: safety-eval
              image: oss-ai-eval-chatbot:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/run_safety_cycle.py"]
              env:
                - name: VERTEX_PROJECT_ID
                  valueFrom:
                    secretKeyRef:
                      name: vertex-credentials
                      key: project-id
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /secrets/service-account.json
                - name: CHATBOT_URL
                  value: http://chatbot:8000
                - name: CHROMA_URL
                  value: http://chroma:8001
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow:5000
              volumeMounts:
                - name: vertex-sa
                  mountPath: /secrets
                  readOnly: true
          volumes:
            - name: vertex-sa
              secret:
                secretName: vertex-credentials
